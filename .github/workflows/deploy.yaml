name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Exits non-zero on a failed page or a broken internal link, including an
      # xref: whose uid does not resolve. The site is served from mew-lang.org
      # at the root, so no base URL is passed.
      - name: Build website
        run: dotnet run --configuration Release -- build

      # Without this, Pages runs the artifact through Jekyll, which strips
      # Pennington's _content/ static-asset folder.
      - name: Disable Jekyll processing
        run: touch output/.nojekyll

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
